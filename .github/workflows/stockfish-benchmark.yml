name: Stockfish patch benchmark

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      - name: Build patch version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master arena/36aae8e1-stockfish
          git checkout --detach origin/arena/36aae8e1-stockfish
          cd src
          make -j"$(nproc)" profile-build
          cp stockfish /tmp/sf_patch

      - name: Build master version
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach origin/master
          cd src
          make clean
          make -j"$(nproc)" profile-build
          cp stockfish /tmp/sf_master

      - name: Validate node counts and measure speed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          /tmp/sf_patch bench 2>&1 | tee benchmark-results/patch-bench.txt
          /tmp/sf_master bench 2>&1 | tee benchmark-results/master-bench.txt
          patch_nodes="$(grep 'Nodes searched' benchmark-results/patch-bench.txt | tail -1 | awk '{print $NF}')"
          master_nodes="$(grep 'Nodes searched' benchmark-results/master-bench.txt | tail -1 | awk '{print $NF}')"
          echo "Patch nodes searched: ${patch_nodes:-NOT FOUND}"
          echo "Master nodes searched: ${master_nodes:-NOT FOUND}"
          test "${patch_nodes:-}" = "1559611"
          test "${master_nodes:-}" = "1559611"
          : > benchmark-results/speed.txt
          for i in $(seq 1 10); do
            echo "Round $i" | tee -a benchmark-results/speed.txt
            /tmp/sf_master bench 2>&1 | grep 'Nodes/second' | sed 's/^/master /' | tee -a benchmark-results/speed.txt
            /tmp/sf_patch bench 2>&1 | grep 'Nodes/second' | sed 's/^/patch  /' | tee -a benchmark-results/speed.txt
          done
          cat benchmark-results/speed.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-benchmark-results
          path: benchmark-results/
          if-no-files-found: warn
